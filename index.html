<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Yantrabhasha Auth</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"/>
</head>
<body>
  <div class="auth-container">
    <!-- Login Card -->
    <div class="auth-card" id="loginCard">
      <div class="avatar">
        <i class="fa fa-user"></i>
      </div>
      <h2>LOGIN</h2>
      <form id="loginForm" autocomplete="off">
        <div class="input-row">
          <i class="fa fa-user"></i>
          <input type="text" id="loginUsername" placeholder="Username" required />
        </div>
        <div class="input-row">
          <i class="fa fa-lock"></i>
          <input type="password" id="loginPassword" placeholder="Password" required />
        </div>
        <div class="options-row">
          <label><input type="checkbox" id="rememberMe" /> Remember me</label>
        </div>
        <button type="submit" class="main-btn">LOGIN</button>
        <p class="small-link"><a href="#">Forgot Username / Password?</a></p>
        <p class="small-link">
          Don't have an account? <a href="#" onclick="showSignup()">Sign up here</a>
        </p>
        <p id="loginError" class="error-msg"></p>
      </form>
    </div>

    <!-- Signup Card -->
    <div class="auth-card" id="signupCard" style="display:none;">
      <h2>SIGN UP</h2>
      <form id="signupForm" autocomplete="off">
        <div class="input-row">
          <i class="fa fa-user"></i>
          <input type="text" id="signupUsername" placeholder="Username" required />
        </div>
        <div class="input-row">
          <i class="fa fa-envelope"></i>
          <input type="email" id="signupEmail" placeholder="E-mail" required />
        </div>
        <div class="input-row">
          <i class="fa fa-lock"></i>
          <input type="password" id="signupPassword" placeholder="Password" required />
        </div>
        <div class="input-row">
          <i class="fa fa-lock"></i>
          <input type="password" id="signupPassword2" placeholder="Confirm Password" required />
        </div>
        <button type="submit" class="main-btn">CREATE ACCOUNT</button>
        <p class="small-link">
          Already have an account? <a href="#" onclick="showLogin()">Login here</a>
        </p>
        <p id="signupError" class="error-msg"></p>
      </form>
    </div>
  </div>
  <script>
    function showSignup() {
      document.getElementById('loginCard').style.display = 'none';
      document.getElementById('signupCard').style.display = 'block';
    }
    function showLogin() {
      document.getElementById('signupCard').style.display = 'none';
      document.getElementById('loginCard').style.display = 'block';
    }
    // You can add form submission JS here...
  </script>
</body>
</html>
